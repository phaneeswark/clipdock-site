<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Save video and audio from YouTube, Instagram and X with ClipDock.">
<title>ClipDock — Download media</title>
<link rel="icon" href="assets/icon.svg">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="shell top">
<a class="brand" href="./"><img src="assets/icon.svg" width="38" height="38" alt="">ClipDock</a>
<button id="theme" type="button" class="secondary" aria-pressed="false">Dark theme</button>
</header>
<main class="shell">
<nav aria-label="ClipDock">
<button type="button" id="download-tab" aria-current="page">↓ Download</button>
<button type="button" id="library-tab">Library</button>
</nav>
<section id="download">
<div class="intro">
<p class="eyebrow">YouTube · Instagram · X</p>
<h1>Download media<span>.</span></h1>
<p>Paste a video link, choose your quality, and save an MP4 or MP3.</p>
</div>
<form id="link-form" class="card">
<label for="url">Media link</label>
<div class="controls">
<input type="url" id="url" name="url" placeholder="https://…" maxlength="2000" required>
<button type="button" class="secondary" id="paste">Paste</button>
<button type="submit" class="primary" id="inspect">Load formats</button>
</div>
</form>
<p id="status" role="status" aria-live="polite"></p>
<section id="result" class="card" hidden aria-labelledby="media-title">
<div class="media">
<img id="thumbnail" alt="" hidden referrerpolicy="no-referrer">
<div><h2 id="media-title"></h2><p id="author"></p></div>
</div>
<div id="formats"></div>
<button type="button" class="primary" id="save">Download</button>
</section>
<p class="note">Save media you own or have permission to download. File location follows your browser’s download settings.</p>
</section>
<section id="library" hidden>
<div class="intro"><p class="eyebrow">Saved on this browser</p><h1>Library<span>.</span></h1><p>Play, save again, or remove your media.</p></div>
<p id="library-status" role="status"></p>
<ul id="files"></ul>
</section>
</main>
</body>
</html>
